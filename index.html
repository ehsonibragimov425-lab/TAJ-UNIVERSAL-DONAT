header {

.games {

}

.game {

}

}

.ff-title {

}

.package {

    border-radius: 13px;
    background: linear-gradient(135deg, #720c20, #d81732);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-appearance: none;

}

.package:active {

    transform: scale(0.98);
}

#orderPage {
    display: none;
    margin-top: 22px;

    border-radius: 14px;
}

#selectedInfo {

}

input {

    margin-top: 12px;
    border-radius: 9px;
    border: 1px solid #ff2638;
    background: #160609;
    color: white;
    font-size: 16px;
}

input::placeholder {
    color: #aaa;
}

.main-button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: 0;
    border-radius: 10px;
    background: #ff2638;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

.back {
    background: #420b17;
    border: 1px solid #ff2638;
}

#result {
    white-space: pre-line;
    margin-top: 15px;
    line-height: 1.6;
    color: #fff;
}

.notice {
    text-align: center;
    color: #aaa;
    margin-top: 25px;
    padding-bottom: 20px;
}

[hidden] {
    display: none !important;
}
</style>
