<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f4fa">
<title>TAJ UNIVERSAL DONAT</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#f4f4fa;
    color:#202033;
    font-family:Arial,sans-serif;
    padding-bottom:100px;
}

header{
    padding:25px 20px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.profile{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{
    width:52px;
    height:52px;
    border-radius:50%;
    background:#6040f5;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-size:25px;
}

.profile h3{font-size:17px}
.profile p{color:#888;margin-top:4px}

.header-icons{
    display:flex;
    gap:10px;
}

.header-icons button{
    width:45px;
    height:45px;
    border:0;
    border-radius:15px;
    background:#fff;
    font-size:22px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:10px 20px;
}

.balance{
    background:linear-gradient(135deg,#7650ff,#4930ed);
    color:white;
    padding:25px;
    border-radius:27px;
    box-shadow:0 12px 25px #6040f533;
}

.balance small{font-size:17px;color:#ddd}
.balance h1{font-size:48px;margin:10px 0 22px}

.balance-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;
}

.balance-actions button{
    padding:15px 5px;
    background:#ffffff20;
    color:white;
    border:1px solid #ffffff55;
    border-radius:17px;
    font-size:12px;
    font-weight:bold;
}

.rating{
    background:white;
    margin:22px 0;
    padding:23px 15px;
    border-radius:25px;
    display:flex;
    align-items:center;
    gap:13px;
    box-shadow:0 2px 5px #00000008;
}

.star{
    background:#fff7d8;
    color:#f5c52c;
    padding:17px;
    border-radius:18px;
    font-size:27px;
}

.rating strong{font-size:27px}
.rating span{color:#f2bd26}

.tabs{
    display:flex;
    background:white;
    padding:7px;
    border-radius:40px;
    margin:20px 0 25px;
}

.tabs button{
    flex:1;
    border:0;
    padding:15px 4px;
    border-radius:35px;
    background:transparent;
    color:#777;
    font-size:14px;
    font-weight:bold;
}

.tabs button.active{
    background:#a38bff;
    color:white;
}

.games{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px 12px;
}

.game{
    border:0;
    background:transparent;
    text-align:center;
    cursor:pointer;
    min-width:0;
}

.game-image{
    height:125px;
    border-radius:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:48px;
    color:white;
    position:relative;
    overflow:hidden;
    box-shadow:0 4px 8px #00000015;
}

.game-image:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(145deg,#ffffff20,transparent);
}

.game-name{
    font-size:13px;
    font-weight:bold;
    margin-top:10px;
}

.pubg{background:linear-gradient(135deg,#70b9e9,#263b66)}
.ff{background:linear-gradient(135deg,#55baff,#5634d8)}
.bs{background:linear-gradient(135deg,#f5a52d,#32203f)}
.cod{background:linear-gradient(135deg,#303b45,#9b6b39)}
.fc{background:linear-gradient(135deg,#3cae65,#124d36)}
.efootball{background:linear-gradient(135deg,#1d68dc,#0b1747)}

.page{display:none}
.page.active{display:block}

.back{
    border:0;
    background:#e9e4ff;
    color:#6040ed;
    padding:12px 20px;
    border-radius:20px;
    font-weight:bold;
    margin-bottom:18px;
}

.game-banner{
    padding:28px 15px;
    border-radius:25px;
    text-align:center;
    color:white;
    margin-bottom:22px;
}

.game-banner .big-icon{font-size:65px}
.game-banner h2{margin-top:10px}

.category-title{
    font-size:18px;
    margin:22px 0 12px;
}

.product{
    width:100%;
    background:white;
    border:1px solid #e9e7f2;
    border-radius:17px;
    padding:17px;
    margin:9px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-align:left;
    color:#222;
      font-size:15px;
    cursor:pointer;
    box-shadow:0 3px 8px #00000005;
}

.product b{color:#6848ef}

#orderBox{
    display:none;
    background:white;
    padding:20px;
    border-radius:22px;
    margin-top:20px;
}

#orderBox input{
    width:100%;
    padding:15px;
    margin:12px 0;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

.primary{
    width:100%;
    padding:16px;
    border:0;
    background:#6746f5;
    color:white;
    border-radius:14px;
    font-size:16px;
    font-weight:bold;
    margin-top:10px;
}

#orderResult{
    white-space:pre-line;
    margin-top:15px;
    line-height:1.6;
}

.bottom-nav{
    position:fixed;
    bottom:8px;
    left:3%;
    width:94%;
    background:white;
    border-radius:35px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    padding:10px 5px;
    box-shadow:0 5px 25px #00000015;
    z-index:10;
}

.bottom-nav button{
    border:0;
    background:transparent;
    color:#aaa;
    padding:10px 2px;
    font-size:12px;
    font-weight:bold;
}

.bottom-nav button.active{
    background:#302d52;
    color:white;
    border-radius:25px;
}

.bottom-nav span{
    display:block;
    font-size:23px;
    margin-bottom:5px;
}

.notice{
    text-align:center;
    color:#aaa;
    font-size:12px;
    margin:25px 0;
}

@media(max-width:380px){
    .game-image{height:100px}
    .game-name{font-size:11px}
    .balance{padding:19px}
}
</style>
</head>

<body>

<header>
    <div class="profile">
        <div class="avatar">👤</div>
        <div>
            <h3>TAJ UNIVERSAL</h3>
            <p>@TajUniversalDonatBot</p>
        </div>
    </div>

    <div class="header-icons">
        <button onclick="showMessage('Бонусҳо ба наздикӣ!')">🎁</button>
        <button onclick="showMessage('Танзимоти намуди сомона')">☾</button>
    </div>
</header>

<div class="container">

    <div class="balance">
        <small>Баланс</small>
        <h1>0.00 <small>сомонӣ</small></h1>

        <div class="balance-actions">
            <button onclick="showMessage('Пур кардани ҳисоб ба наздикӣ фаъол мешавад')">▣<br>Пур кардани ҳисоб</button>
            <button onclick="showMessage('Рамзҳои бонусӣ ба наздикӣ')">🎟<br>Рамзҳои бонус</button>
            <button onclick="showMessage('Дастгирӣ ба наздикӣ')">▢<br>Дастгирӣ</button>
        </div>
    </div>

    <div class="rating">
        <div class="star">★</div>
        <strong>5.0</strong>
        <span>★★★★★</span>
        <small style="color:#999">TAJ DONAT</small>
    </div>

    <div class="tabs">
        <button class="active" onclick="changeTab(this,'gamesPage')">Бозиҳо</button>
        <button onclick="changeTab(this,'giftPage')">Gift Code</button>
        <button onclick="changeTab(this,'aiPage')">🤖 AI</button>
    </div>

    <section id="gamesPage" class="page active">

        <div class="games">

            <button class="game" onclick="openGame('pubg')">
                <div class="game-image pubg">🎯</div>
                <div class="game-name">PUBG MOBILE</div>
            </button>

            <button class="game" onclick="openGame('freefire')">
                <div class="game-image ff">🔥</div>
                <div class="game-name">FREE FIRE</div>
            </button>

            <button class="game" onclick="openGame('blood')">
                <div class="game-image bs">💥</div>
                <div class="game-name">BLOOD STRIKE</div>
            </button>

            <button class="game" onclick="showMessage('Ба наздикӣ илова мешавад')">
                <div class="game-image cod">⚔️</div>
                <div class="game-name">CALL OF DUTY</div>
            </button>

            <button class="game" onclick="showMessage('Ба наздикӣ илова мешавад')">
                <div class="game-image fc">⚽</div>
                <div class="game-name">FC MOBILE</div>
            </button>

            <button class="game" onclick="showMessage('Ба наздикӣ илова мешавад')">
                <div class="game-image efootball">🎮</div>
                <div class="game-name">EFOOTBALL</div>
                    </button>

        </div>
    </section>

    <section id="giftPage" class="page">
        <h2>🎁 Gift Code</h2>
        <p style="color:#888">Gift Code ба наздикӣ илова мешавад.</p>
    </section>

    <section id="aiPage" class="page">
        <h2>🤖 TAJ AI</h2>
        <p style="color:#888">Ёвари AI ба наздикӣ фаъол мешавад.</p>
    </section>

    <section id="gameDetail" class="page">
        <button class="back" onclick="goHome()">← Бозгашт</button>
        <div id="gameContent"></div>

        <div id="orderBox">
            <h3>📝 Оформление заказа</h3>
            <p id="selectedInfo" style="margin:12px 0;color:#6746f5"></p>

            <input id="playerId" type="text" placeholder="Player ID">

            <button class="primary" onclick="confirmOrder()">
                Тасдиқи фармоиш
            </button>

            <p id="orderResult"></p>
        </div>
    </section>

    <div class="notice">
        TAJ UNIVERSAL DONAT • 2026
    </div>

</div>

<nav class="bottom-nav">
    <button class="active" onclick="navHome(this)">
        <span>▦</span>Меню
    </button>
    <button onclick="navInfo(this,'Таърихи фармоишҳо ҳоло холӣ аст')">
        <span>◷</span>Таърих
    </button>
    <button onclick="navInfo(this,'Дӯстон ба наздикӣ')">
        <span>♧</span>Дӯстон
    </button>
    <button onclick="navInfo(this,'Танзимот ба наздикӣ')">
        <span>♙</span>Танзимот
    </button>
</nav>

<script>
let currentGame = "";
let selectedProduct = "";
let selectedPrice = 0;

const products = {
    freefire: {
        title: "FREE FIRE",
        icon: "🔥",
        banner: "linear-gradient(135deg,#55baff,#5634d8)",
        categories: [
            {
                title: "💎 АЛМАЗҲО",
                items: [
                    ["105 алмаз",9],
                    ["340 алмаз",29],
                    ["572 алмаз",58],
                    ["1100 алмаз",97.50],
                    ["2300 алмаз",205],
                    ["6100 алмаз",480]
                ]
            },
            {
                title: "🎟 ВАУЧЕРҲО",
                items: [
                    ["Ваучер на неделю",18],
                    ["Ваучер на месяц",75],
                    ["Ваучер Лайт",6]
                ]
            }
        ]
    },

    pubg: {
        title: "PUBG MOBILE",
        icon: "🎯",
        banner: "linear-gradient(135deg,#70b9e9,#263b66)",
        categories: [
            {
                title: "🪙 UC",
                items: [
                    ["60 UC",10],
                    ["325 UC",47],
                    ["660 UC",94],
                    ["985 UC",142]
                ]
            },
            {
                title: "👑 ELITE PASS",
                items: [
                    ["Elite Pass LV1-50",58],
                    ["Elite Pass LV1-100",118],
                    ["Elite Pass Plus LV1-100",280]
                ]
            }
        ]
    },

    blood: {
        title: "BLOOD STRIKE",
        icon: "💥",
        banner: "linear-gradient(135deg,#f5a52d,#32203f)",
        categories: [
            {
                title: "🪙 GOLD",
                items: [
                    ["51 Gold",5],
                    ["105 Gold",10],
                    ["320 Gold",27],
                    ["540 Gold",44],
                    ["1100 Gold",87],
                    ["2260 Gold",170],
                    ["5800 Gold",430]
                ]
            },
            {
                title: "🎟 PASS",
                items: [
                    ["Strike Pass Elite",37],
                    ["Strike Pass Premium",80],
                    ["Level Up Pass",18]
                ]
            }
        ]
    }
};

function changeTab(button,id) {
    document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");

    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function openGame(game) {
    currentGame = game;
    const data = products[game];
       let html = `
        <div class="game-banner" style="background:${data.banner}">
            <div class="big-icon">${data.icon}</div>
            <h2>${data.title}</h2>
            <p>Пакетро интихоб кунед</p>
        </div>
    `;

    data.categories.forEach(category=>{
        html += <h3 class="category-title">${category.title}</h3>;

        category.items.forEach(item=>{
            html += `
                <button class="product"
                    onclick="selectProduct('${item[0]}',${item[1]})">
                    <span>💎 ${item[0]}</span>
                    <b>${item[1]} сомонӣ →</b>
                </button>
            `;
        });
    });

    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("gameDetail").classList.add("active");
    document.getElementById("gameContent").innerHTML = html;

    document.getElementById("orderBox").style.display = "none";
    window.scrollTo(0,0);
}

function selectProduct(name,price) {
    selectedProduct = name;
    selectedPrice = price;

    document.getElementById("orderBox").style.display = "block";
    document.getElementById("selectedInfo").textContent =
        name + " — " + price + " сомонӣ";

    document.getElementById("playerId").value = "";
    document.getElementById("orderResult").textContent = "";

    document.getElementById("orderBox").scrollIntoView({
        behavior:"smooth",
        block:"start"
    });
}

function confirmOrder() {
    const id = document.getElementById("playerId").value.trim();

    if(!id) {
        document.getElementById("orderResult").textContent =
            "Лутфан Player ID-ро ворид кунед.";
        return;
    }

    document.getElementById("orderResult").textContent =
        "✅ Фармоиш омода шуд!\n" +
        "Маҳсулот: " + selectedProduct + "\n" +
        "Нарх: " + selectedPrice + " сомонӣ\n" +
        "ID: " + id + "\n\n" +
        "Ин фармоиш ҳоло ба админ фиристода намешавад.";
}

function goHome() {
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("gamesPage").classList.add("active");
    document.getElementById("orderBox").style.display = "none";
    window.scrollTo(0,0);
}

function navHome(button) {
    document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");

    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("gamesPage").classList.add("active");
    window.scrollTo(0,0);
}

function navInfo(button,message) {
    document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");
    showMessage(message);
}

function showMessage(message) {
    alert(message);
}

if(window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
}
</script>

</body>
</html>
